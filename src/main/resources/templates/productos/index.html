<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-container { background-color: #f4f4f4; padding: 20px; border-radius: 5px; margin-bottom: 20px; width: 350px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .btn-editar { color: blue; text-decoration: none; margin-right: 10px; }
        .btn-eliminar { color: red; text-decoration: none; }
    </style>
</head>
<body>

    <h1>Gestión de Productos</h1>

    <!-- FORMULARIO DE PRODUCTOS -->
    <div class="form-container">
        <h3 th:text="${nuevoProducto.id == null} ? 'Nuevo Producto' : 'Editar Producto'"></h3>
        
        <form th:action="@{/productos/guardar}" th:object="${nuevoProducto}" method="post">
            
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="codigo">Código:</label>
                <input type="text" id="codigo" th:field="*{codigo}" required />
            </div>

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" required />
            </div>

            <div class="form-group">
                <label for="precio">Precio:</label>
                <input type="number" step="0.01" id="precio" th:field="*{precio}" required />
            </div>

            <div class="form-group">
                <label for="stockActual">Stock:</label>
                <input type="number" id="stockActual" th:field="*{stockActual}" required />
            </div>

            <!-- DESPLEGABLE DE CATEGORÍAS -->
            <div class="form-group">
                <label for="categoria">Categoría:</label>
                <select id="categoria" th:field="*{categoria.id}" required>
                    <option value="">-- Seleccionar Categoría --</option>
                    <option th:each="cat : ${categorias}" 
                            th:value="${cat.id}" 
                            th:text="${cat.nombre}">
                    </option>
                </select>
            </div>

            <button type="submit" th:text="${nuevoProducto.id == null} ? 'Guardar' : 'Actualizar'"></button>
            <a th:if="${nuevoProducto.id != null}" th:href="@{/productos}">Cancelar</a>
        </form>
    </div>

    <!-- TABLA DE PRODUCTOS -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock Actual</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prod : ${productos}">
                <td th:text="${prod.id}">1</td>
                <td th:text="${prod.codigo}">P001</td>
                <td th:text="${prod.nombre}">Producto Ejemplo</td>
                <td th:text="${prod.precio}">0.00</td>
                <td th:text="${prod.stockActual}">0</td>
                <!-- Muestra el nombre de la categoría mapeada por JPA -->
                <td th:text="${prod.categoria != null ? prod.categoria.nombre : 'Sin categoría'}">Categoría</td>
                <td>
                    <a th:href="@{/productos/editar/{id}(id=${prod.id})}" class="btn-editar">Editar</a>
                    <a th:href="@{/productos/eliminar/{id}(id=${prod.id})}" 
                       class="btn-eliminar"
                       onclick="return confirm('¿Deseas eliminar este producto?');">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
